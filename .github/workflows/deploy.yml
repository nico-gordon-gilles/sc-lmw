name: Update the live site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pythonanywhere
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the tree and reload PythonAnywhere
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python scripts/deploy_pythonanywhere.py
